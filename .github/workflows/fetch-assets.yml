name: fetch-assets

# Downloads every entry in assets/manifest.json that is not yet in the repo
# and commits it. Lets generated models (Higgsfield etc.) and free asset packs
# (Kenney etc.) flow into the project with nothing more than a manifest edit.

on:
  push:
    paths:
      - assets/manifest.json
      - .github/workflows/fetch-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download missing assets
        run: |
          set -e
          mkdir -p assets/kit assets/keyart
          python3 - <<'EOF'
          import json, os, io, fnmatch, zipfile, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 river-royale-fetch"}
          def get(url, extra=None):
              h = dict(UA); h.update(extra or {})
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=300) as r:
                  return r.read()
          m = json.load(open("assets/manifest.json"))
          got = 0
          # single files
          jobs = [("assets/kit", e, ".glb") for e in m.get("kit", [])] + \
                 [("assets/keyart", e, ".png") for e in m.get("keyart", [])]
          for folder, e, ext in jobs:
              path = os.path.join(folder, e["name"] + ext)
              if os.path.exists(path) and os.path.getsize(path) > 0:
                  continue
              print("fetching", path)
              open(path, "wb").write(get(e["url"]))
              got += 1
          # zip packs
          for pk in m.get("packs", []):
              dest = pk["dest"]
              marker = os.path.join(dest, ".fetched")
              if os.path.exists(marker):
                  continue
              url = pk.get("url")
              extra = {"Referer": pk["referer"]} if pk.get("referer") else {}
              if pk.get("resolve"):
                  url = json.loads(get(pk["resolve"], dict(extra, Accept="application/json")))["url"]
              print("fetching pack", pk["name"])
              z = zipfile.ZipFile(io.BytesIO(get(url, extra)))
              os.makedirs(dest, exist_ok=True)
              n = 0
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  if any(fnmatch.fnmatch(info.filename, g) for g in pk["extract"]):
                      out = os.path.join(dest, os.path.basename(info.filename))
                      open(out, "wb").write(z.read(info))
                      n += 1
              open(marker, "w").write("%s\n%s\n" % (pk["name"], pk.get("license", "")))
              print("  extracted", n, "files")
              got += n
          print("downloaded", got, "new files")
          EOF

      - name: Commit
        run: |
          git config user.name "river-royale-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "assets: fetch from manifest"
            git push
          fi
